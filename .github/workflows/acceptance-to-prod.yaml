name: Acceptance to prod, copy CMS content

on:
    workflow_dispatch:

jobs:
    copy-db:
        runs-on: ubuntu-latest
        steps:
            -   name: Install SSH key
                uses: shimataro/ssh-key-action@v2
                with:
                    key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
                    known_hosts: server.zenmo.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ1E4LUG22qgzc8U7oNYGWCn0cyA31+iyX2pck9wcPMS
            -   name: pg_dump
                run: >
                    ssh root@server.zenmo.com
                    docker run --rm
                    -e PGPASSWORD='${{ secrets.DB_PASSWORD_ACCEPTANCE }}'
                    -v /tmp:/tmp
                    postgres:16
                    pg_dump
                    --username=holon-acceptance
                    --dbname=holon-acceptance
                    --no-privileges
                    --no-owner
                    --host=postgres.zenmo.com
                    --exclude-table=holon_cache
                    --format=custom
                    --file=/tmp/acceptance.pg_dump
            -   name: pg_restore
                run: >
                    ssh root@server.zenmo.com
                    docker run --rm
                    -e PGPASSWORD='${{ secrets.DB_PASSWORD_PROD }}'
                    -v /tmp:/tmp
                    postgres:16
                    pg_restore
                    --username=holon-production
                    --dbname=holon-production
                    --clean
                    --no-owner
                    --no-privileges
                    --host=postgres.zenmo.com
                    /tmp/acceptance.pg_dump
            -   name: Remove dump file
                if: always()
                run: ssh root@server.zenmo.com rm -f /tmp/acceptance.pg_dump

    copy-pictures:
        runs-on: ubuntu-latest
        container:
            image: rclone/rclone:1.69.3
        steps:
            -   name: rclone config
                run: >
                    rclone config create holonstorage azureblob
                    account=holonstorage
                    key=${{ secrets.AZURE_STORAGE_KEY }}
            -   name: rclone copy
                run: rclone copy holonstorage:media-acceptatie holonstorage:media
